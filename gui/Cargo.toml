[package]
name = "neocruncher-gui"
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-only"
description = "Linux desktop frontend for the NeoCruncher CLI"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
